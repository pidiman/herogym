name: Deploy to oracle-free-1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-herogym
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "pidiman@${DEPLOY_HOST}" \
            'set -e
             cd ~/docker/herogym
             git fetch --quiet origin main
             git reset --hard origin/main
             docker compose up -d --build --remove-orphans
             docker image prune -f >/dev/null
             for i in $(seq 1 30); do
               s=$(docker inspect -f "{{.State.Health.Status}}" herogym-web herogym-api | sort -u)
               [ "$s" = healthy ] && { echo "healthy"; exit 0; }
               sleep 5
             done
             docker compose ps; exit 1'
